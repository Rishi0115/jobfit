version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobfit
      POSTGRES_USER: jobfit_user
      POSTGRES_PASSWORD: jobfit_password
    ports:
      - "5433:5432"
    volumes:
      - jobfit_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: jobfit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jobfit_minio_data:/data

volumes:
  jobfit_postgres_data:
  jobfit_minio_data:
